server:
  port: 8080
spring:
  application:
    name: handler
  config:
    import: configserver:http://localhost:8888
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://192.168.29.229:5000/cred-manager
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
encryption:
  public-key-path: keys/pass_encryption_public_key.pem

